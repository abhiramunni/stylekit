<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleKit — Dress Well, Decide Fast</title>
<meta name="description" content="StyleKit plans your outfits from the clothes you already own — mix-and-match builder, laundry rotation, week planner and cost-per-wear.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e5; --paper2:#fbf7ee; --card:#fffdf7; --ink:#2b1d12; --ink2:#5d4a33;
  --muted:#8a7560; --line:#e5d9c3; --bronze:#b07d3c; --amber:#d9a441; --gold:#c9a227;
  --terra:#c05f33; --terra-soft:#f3e0d3; --green:#5f7a4e; --green-soft:#e6ecdd;
  --red:#a83c2a; --red-soft:#f6e3de; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
img{max-width:100%;display:block}
a{color:var(--bronze)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.78rem;font-weight:600;letter-spacing:.02em}
.pill-bronze{background:#f0e2c8;color:#7a5518}
.pill-green{background:var(--green-soft);color:#43582f}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-terra{background:var(--terra-soft);color:#8a3c1e}
.pill-grey{background:#efe9db;color:var(--ink2)}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241608,#3a2412 55%,#5c3a17);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .logo-mark{width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#d9a441,#b07d3c);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:logoIn 1s cubic-bezier(.2,.9,.3,1.2) both}
#intro .logo-mark svg{width:52px;height:52px;stroke:#fff8ea}
@keyframes logoIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(2.4rem,7vw,4rem);margin:26px 0 8px;animation:rise .8s .25s ease both}
#intro .tag{font-size:1.08rem;color:#e8cfa5;animation:rise .8s .45s ease both}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(247,234,210,.25);border-radius:99px;margin-top:34px;overflow:hidden;animation:rise .8s .6s ease both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8b64c,#c05f33);border-radius:99px;animation:fill 3.2s .3s ease forwards}
@keyframes fill{to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
#intro .skip{position:absolute;bottom:26px;font-size:.85rem;color:#d9c39a;letter-spacing:.06em;text-transform:uppercase}
#intro.quick .bar i{animation-duration:.7s}
#intro.quick h1,#intro.quick .tag,#intro.quick .bar{animation-duration:.3s}
/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:60;background:rgba(247,241,229,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.site-in{display:flex;align-items:center;gap:14px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#d9a441,#b07d3c);display:flex;align-items:center;justify-content:center;flex:none}
.brand .mark svg{width:22px;height:22px;stroke:#fff8ea}
.brand em{font-style:normal;color:var(--bronze)}
nav.main{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.main button{padding:8px 13px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--ink2)}
nav.main button:hover{background:#efe6d2}
nav.main button.on{background:var(--ink);color:#f7f1e5}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin-bottom:-64px}
.hero img{width:100%;height:460px;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.2%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,18,.05) 40%,rgba(43,29,18,.62))}
.hero-copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 28px 92px;color:#fdf6e7}
.hero-copy h1{font-size:clamp(2rem,5.4vw,3.3rem);max-width:640px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero-copy p{margin-top:8px;max-width:560px;color:#f3e6cd;font-size:1.02rem}
.today-card{position:relative;z-index:3;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.today-card .tc-label{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze)}
.today-card h2{font-size:1.5rem;margin-top:2px}
.today-pieces{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.today-card .tc-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:.95rem;transition:transform .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#f7f1e5}
.btn-dark:hover{box-shadow:0 8px 20px rgba(43,29,18,.3)}
.btn-ghost{border:1.5px solid var(--ink);color:var(--ink)}
.btn-bronze{background:linear-gradient(145deg,#d9a441,#b07d3c);color:#fff8ea}
.btn-sm{padding:8px 14px;font-size:.88rem}
/* ---------- sections ---------- */
section{padding:44px 0 8px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:1.7rem}
.sec-head .kicker{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.sec-sub{color:var(--muted);max-width:640px;margin-bottom:20px}
/* ---------- builder ---------- */
.builder{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;overflow:hidden}
.builder-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper2);font-weight:600;font-size:.88rem;color:var(--ink2)}
.chip:hover{border-color:var(--bronze)}
.chip.on{background:var(--ink);color:#f7f1e5;border-color:var(--ink)}
.builder-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.slot h3{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slot h3 svg{width:20px;height:20px;stroke:var(--bronze)}
.slot .picked{font-size:.8rem;color:var(--bronze);font-weight:700;margin-left:auto}
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:#d8c9a8;border-radius:99px}
.item-card{flex:0 0 148px;scroll-snap-align:start;background:var(--paper2);border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;position:relative}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.item-card.sel{border-color:var(--bronze);background:#fdf6e3;box-shadow:0 0 0 2px rgba(176,125,60,.35)}
.item-card.laundry{opacity:.55}
.item-card .swatch{width:100%;height:64px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.item-card .swatch svg{width:34px;height:34px;stroke:rgba(43,29,18,.55)}
.item-card .nm{font-weight:700;font-size:.92rem;line-height:1.3}
.item-card .meta{font-size:.78rem;color:var(--muted);margin-top:3px}
.item-card .flag{position:absolute;top:8px;right:8px;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--red-soft);color:var(--red)}
.item-card .laundry-tag{position:absolute;top:8px;right:8px;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:99px;background:#e8e0cd;color:var(--ink2)}
.builder-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px;padding-top:16px;border-top:1px dashed var(--line)}
.builder-foot .verdict{font-weight:600}
.builder-foot .verdict span{color:var(--bronze)}
.save-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.save-row input{flex:1;min-width:180px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
/* ---------- saved outfits rail ---------- */
.outfit-rail{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.outfit-card{flex:0 0 300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.outfit-card .oc-photo{height:120px;position:relative;overflow:hidden}
.outfit-card .oc-photo img{width:100%;height:100%;object-fit:cover}
.outfit-card .oc-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(43,29,18,.55))}
.outfit-card .oc-name{position:absolute;left:14px;bottom:10px;z-index:2;color:#fdf6e7;font-family:'Fraunces',serif;font-size:1.25rem;font-weight:700}
.outfit-card .oc-body{padding:14px 16px 16px}
.outfit-card .oc-pieces{font-size:.9rem;color:var(--ink2);line-height:1.7}
.outfit-card .oc-foot{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.outfit-card .oc-foot .wears{font-size:.82rem;color:var(--muted);margin-left:auto}

/* ---------- wardrobe grid ---------- */
.ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ward-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.ward-card .swatch{width:64px;height:64px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.ward-card .swatch svg{width:32px;height:32px;stroke:rgba(43,29,18,.55)}
.ward-card .nm{font-weight:700;line-height:1.3}
.ward-card .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
.ward-card .cpw{font-size:.82rem;margin-top:6px;color:var(--ink2)}
.ward-card .cpw b{color:var(--bronze)}
.ward-card .wc-actions{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;background:var(--paper2)}
.icon-btn:hover{border-color:var(--bronze)}
.icon-btn svg{width:17px;height:17px;stroke:var(--ink2)}
.add-form{background:var(--card);border:1.5px dashed var(--bronze);border-radius:18px;padding:18px;margin-top:16px}
.add-form h3{margin-bottom:12px}
.add-form .frow{display:flex;gap:10px;flex-wrap:wrap}
.add-form input,.add-form select{padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;flex:1;min-width:140px}
/* ---------- laundry ---------- */
.laundry-strip{background:linear-gradient(120deg,#efe3c8,#f3e0d3);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.laundry-strip h3{font-size:1.2rem}
.laundry-items{display:flex;gap:8px;flex-wrap:wrap}
.laundry-chip{display:inline-flex;align-items:center;gap:8px;background:#fffdf7;border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 14px;font-weight:600;font-size:.88rem}
.laundry-chip button{background:var(--green-soft);color:#43582f;border-radius:99px;padding:5px 11px;font-weight:700;font-size:.8rem}
/* ---------- week planner ---------- */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day-cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 12px;min-height:150px;text-align:left}
.day-cell.today{border-color:var(--bronze);box-shadow:0 0 0 2px rgba(176,125,60,.3)}
.day-cell .dow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.day-cell .dnum{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700}
.day-cell .dout{font-size:.82rem;line-height:1.45;margin-top:8px;color:var(--ink2)}
.day-cell .dout b{color:var(--ink);display:block}
.day-cell .dempty{font-size:.82rem;color:var(--muted);margin-top:8px}
.day-cell select{width:100%;margin-top:8px;padding:7px 8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:.84rem}
/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat .num{font-family:'Fraunces',serif;font-size:2rem;font-weight:700;color:var(--bronze)}
.stat .lbl{font-size:.85rem;color:var(--muted);margin-top:2px}
/* ---------- guides ---------- */
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.guide{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.guide:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.guide h3{font-size:1.12rem;margin:10px 0 6px}
.guide p{font-size:.9rem;color:var(--muted)}
.guide .g-ic{width:44px;height:44px;border-radius:13px;background:#f0e2c8;display:flex;align-items:center;justify-content:center}
.guide .g-ic svg{width:24px;height:24px;stroke:var(--bronze)}
